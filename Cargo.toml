[workspace]
members = ["crates/fm27-core", "crates/fm27-cli", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
