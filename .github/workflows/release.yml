name: Release Unsigned Universal DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.0). Leave empty to use the selected ref; running from a branch then only builds artifacts."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare frontend and release metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Check version consistency
        run: node scripts/version.mjs --check

      - name: Determine release tag
        id: meta
        if: github.ref_type == 'tag' || inputs.tag != ''
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then
            echo "::error::Release tag must start with 'v' (for example v1.0.0), got '$TAG'"
            exit 1
          fi
          VERSION="${TAG#v}"
          CONFIG_VERSION="$(node scripts/version.mjs)"
          if [[ "${VERSION%%-*}" != "$CONFIG_VERSION" ]]; then
            echo "::error::Tag '$TAG' does not match Cargo.toml version '$CONFIG_VERSION'. Bump the version before releasing."
            exit 1
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Frontend build
        working-directory: apps/desktop
        run: pnpm build

      - name: Frontend tests
        working-directory: apps/desktop
        run: pnpm test

      - name: Upload frontend bundle
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: apps/desktop/dist
          retention-days: 1
          if-no-files-found: error

  verify:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-release-verify
          cache-bin: false
          save-if: false

      - name: Rust tests
        run: cargo test -p fm27-core

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Download frontend bundle
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: apps/desktop/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Release builds run from tags, whose cache scope does not help the next
      # release anyway. Keep them out of the repository's 10 GB cache budget.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-release
          key: ${{ matrix.target }}
          cache-bin: false
          save-if: false

      - name: Build ${{ matrix.target }} binary
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FM27_UPDATER_PUBKEY: ${{ secrets.FM27_UPDATER_PUBKEY }}
        run: |
          CONFIG="$RUNNER_TEMP/tauri.release.json"
          if [[ -n "$TAURI_SIGNING_PRIVATE_KEY" && -n "$FM27_UPDATER_PUBKEY" ]]; then
            jq -n --arg pubkey "$FM27_UPDATER_PUBKEY" \
              '{build:{beforeBuildCommand:""},bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:$pubkey}}}' \
              > "$CONFIG"
          else
            jq -n '{build:{beforeBuildCommand:""}}' > "$CONFIG"
          fi
          cd apps/desktop
          pnpm tauri build --target ${{ matrix.target }} --no-bundle --config "$CONFIG"

      - name: Upload ${{ matrix.target }} binary
        uses: actions/upload-artifact@v7
        with:
          name: fm27-binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/fm27-scout-desktop
          retention-days: 1
          if-no-files-found: error

  merge:
    name: Bundle universal DMG
    needs: [prepare, verify, build]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.3.4

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Download frontend bundle
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: apps/desktop/dist

      - name: Download arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: fm27-binary-aarch64-apple-darwin
          path: artifacts/aarch64

      - name: Download x86_64 binary
        uses: actions/download-artifact@v8
        with:
          name: fm27-binary-x86_64-apple-darwin
          path: artifacts/x86_64

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Merge universal binary
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            artifacts/aarch64/fm27-scout-desktop \
            artifacts/x86_64/fm27-scout-desktop \
            -output target/universal-apple-darwin/release/fm27-scout-desktop
          chmod +x target/universal-apple-darwin/release/fm27-scout-desktop
          lipo -info target/universal-apple-darwin/release/fm27-scout-desktop

      - name: Bundle universal app and DMG
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FM27_UPDATER_PUBKEY: ${{ secrets.FM27_UPDATER_PUBKEY }}
        run: |
          CONFIG="$RUNNER_TEMP/tauri.release.json"
          if [[ -n "$TAURI_SIGNING_PRIVATE_KEY" && -n "$FM27_UPDATER_PUBKEY" ]]; then
            echo "Updater signing configured; building signed updater artifacts."
            jq -n --arg pubkey "$FM27_UPDATER_PUBKEY" \
              '{build:{beforeBuildCommand:""},bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:$pubkey}}}' \
              > "$CONFIG"
            echo "UPDATER=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Updater secrets are not configured; building without signed updater artifacts."
            jq -n '{build:{beforeBuildCommand:""}}' > "$CONFIG"
          fi
          cd apps/desktop
          pnpm tauri bundle --target universal-apple-darwin --bundles app,dmg \
            --config "$CONFIG"

      - name: Verify universal binary and DMG
        run: |
          APP="target/universal-apple-darwin/release/bundle/macos/FM27 Scout.app"
          BINARY="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 | head -n 1)"
          lipo -info "$BINARY"
          lipo -archs "$BINARY" | grep -qw arm64
          lipo -archs "$BINARY" | grep -qw x86_64
          for dmg in target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            hdiutil verify "$dmg"
          done

      - name: Prepare release assets
        env:
          TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          mkdir -p release-assets

          VERSION="${TAG#v}"
          if [[ -n "$TAG" ]]; then
            DMG_NAME="fm27-scout-${VERSION}-universal.dmg"
          else
            DMG_NAME="fm27-scout-universal.dmg"
          fi

          DMG="$(find target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$DMG"
          cp "$DMG" "release-assets/$DMG_NAME"

          if [[ "$UPDATER" == "1" ]]; then
            ARCHIVE="$(find target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
            test -n "$ARCHIVE"
            test -f "${ARCHIVE}.sig"
            if [[ -n "$TAG" ]]; then
              ARCHIVE_NAME="fm27-scout-${VERSION}-universal.app.tar.gz"
              cp "$ARCHIVE" "release-assets/$ARCHIVE_NAME"
              cp "${ARCHIVE}.sig" "release-assets/${ARCHIVE_NAME}.sig"

              DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ARCHIVE_NAME}"
              SIGNATURE="$(cat "${ARCHIVE}.sig")"
              PUB_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
              jq -n \
                --arg version "$VERSION" \
                --arg notes "See the release notes on GitHub." \
                --arg pub_date "$PUB_DATE" \
                --arg signature "$SIGNATURE" \
                --arg url "$DOWNLOAD_URL" \
                '{
                  version: $version,
                  notes: $notes,
                  pub_date: $pub_date,
                  platforms: {
                    "darwin-aarch64": { signature: $signature, url: $url },
                    "darwin-x86_64": { signature: $signature, url: $url }
                  }
                }' > release-assets/latest.json
            fi
          fi

          cd release-assets
          shopt -s nullglob
          files=( *.dmg )
          if [[ "$UPDATER" == "1" && -n "$TAG" ]]; then
            files+=( ./*.app.tar.gz ./*.app.tar.gz.sig latest.json )
          fi
          shasum -a 256 "${files[@]}" > SHA256SUMS.txt

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: fm27-scout-release-assets
          path: release-assets/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [prepare, verify, merge]
    if: needs.prepare.outputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: fm27-scout-release-assets
          path: release-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_NOTES: |
            > [!WARNING]
            > 此版本未签名、未公证，首次打开会被 macOS 拦截。
            > This build is **unsigned and not notarized**; macOS Gatekeeper blocks it on first launch.

            **First launch on macOS**

            1. Open the DMG and drag **FM27 Scout** into **Applications**.
            2. Try to open the app once.
            3. Open **System Settings → Privacy & Security**, scroll down, and click **Open Anyway**.
            4. Confirm **Open**.

            Alternatively, remove the quarantine flag from Terminal:

            ```bash
            xattr -dr com.apple.quarantine "/Applications/FM27 Scout.app"
            open "/Applications/FM27 Scout.app"
            ```

            Only download this build if you trust this repository.
        run: |
          cd release-assets
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./* --clobber
          else
            gh release create "$TAG" ./* \
              --title "FM27 Scout $TAG (unsigned)" \
              --notes "$RELEASE_NOTES" \
              --generate-notes \
              --verify-tag
          fi
